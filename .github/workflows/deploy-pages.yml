name: Deploy moin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static files
        run: |
          mkdir -p dist
          cp AGENTIC_STATUS.json dist/
          cp admin.css dist/
          cp admin.html dist/
          cp admin.js dist/
          cp index.html dist/
          cp main.js dist/
          cp payment-result.html dist/
          cp payment-result.js dist/
          cp supabase-client.js dist/
          cp supabase-config.js dist/
          cp styles.css dist/
          cp toss-config.js dist/
          ASSET_VERSION="${GITHUB_SHA::12}"
          find dist -type f \( -name '*.html' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i "s/__ASSET_VERSION__/${ASSET_VERSION}/g"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
