name: Deploy moin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Run browser smoke checks
        run: npm run smoke:browser
        env:
          CHROME_BIN: /usr/bin/google-chrome

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare static files
        run: |
          mkdir -p dist
          node scripts/create-public-agentic-status.mjs AGENTIC_STATUS.json dist/PUBLIC_AGENTIC_STATUS.json
          cp admin.css dist/
          cp admin-availability.js dist/
          cp admin.html dist/
          cp admin.js dist/
          cp admin-meetup-form.js dist/
          cp admin-render.js dist/
          cp admin-status.js dist/
          cp escape-html.js dist/
          cp index.html dist/
          cp terms.html dist/
          cp refund.html dist/
          cp privacy.html dist/
          cp main.js dist/
          cp modal-manager.js dist/
          cp toast-queue.js dist/
          cp toss-checkout.js dist/
          cp payment-result.html dist/
          cp payment-result.js dist/
          cp payment-result-state.js dist/
          cp public-availability.js dist/
          cp public-flow.js dist/
          cp public-form.js dist/
          cp public-meetup.js dist/
          cp public-storage.js dist/
          cp supabase-client.js dist/
          cp supabase-config.js dist/
          cp styles.css dist/
          cp toss-config.js dist/
          cp manifest.webmanifest dist/
          cp -R icons dist/
          cp sw.js dist/
          cp push-client.js dist/
          cp push-config.js dist/
          cp my-history.html dist/
          cp my-history.js dist/
          cp history-view.js dist/
          cp pwa-install.js dist/
          ASSET_VERSION="${GITHUB_SHA::12}"
          find dist -type f \( -name '*.html' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i "s/__ASSET_VERSION__/${ASSET_VERSION}/g"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
